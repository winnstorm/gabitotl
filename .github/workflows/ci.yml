name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is not in the matrix: the end-to-end suite needs a POSIX shell
        # (fake agent executables) and Windows behavior is untested in V1.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...

  # Windows: only the packages expected to work there. The full `go test ./...`
  # stays off Windows because the e2e suite needs a POSIX shell and Windows
  # behavior is untested elsewhere in V1 (see the matrix comment above).
  windows:
    name: windows-latest (manager)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: go test (Windows-relevant packages)
        run: go test ./internal/desktop/... ./internal/gui/... ./cmd/gabitotl-manager/...

      - name: build the manager (windowsgui)
        run: go build -tags desktop,production -ldflags "-H windowsgui" -o gabitotl-manager.exe ./cmd/gabitotl-manager

      - name: build the manager with the embedded CLI (dummy bundle)
        shell: bash
        run: |
          mkdir -p cmd/gabitotl-manager/bundled
          echo dummy > cmd/gabitotl-manager/bundled/gabitotl.exe
          go vet -tags desktop,production,embedcli ./cmd/gabitotl-manager/...
          go build -tags desktop,production,embedcli -ldflags "-H windowsgui" -o gabitotl-setup.exe ./cmd/gabitotl-manager
